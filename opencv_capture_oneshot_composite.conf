# opencv_capture_oneshot.conf の Composite 版。
# カメラから読む → 色変換 → ファイルに書く、の 3 段を接続ではなく 1 つの
# CompositeContainerProcess (capture_save) にまとめる。呼び出すたびに 1 枚撮って保存する。
#
#   capture_save(cc{camera, fs}, path)
#     = filesystem_imwrite(cc.fs,
#           img = cv_cvt_color(img = video_capture_readandget(cc.camera), code = "BGR2RGB"),
#           file_name = path)
name: opencv_capture_oneshot_composite
option:
  http_broker:
    start: true
    port: 8000
plugins:
  components:
    juiz_opencv:
      path: "./target/debug"
composites:
  - type_name: capture_save
    description: "カメラから 1 枚撮って、色を変換してファイルに保存する"
    containers:
      camera: video_capture
      fs: filesystem
    body:
      process: filesystem_imwrite
      container: fs
      args:
        img:
          process: cv_cvt_color
          args:
            img: { process: video_capture_readandget, container: camera }
            code: { const: "BGR2RGB" }
        file_name: { expose: { name: path, default: "capture.png" } }
containers:
  - type_name: video_capture
    name: cv_camera0
    camera_id: 0
  - type_name: filesystem
    name: filesystem0
composite_containers:
  - name: cam_fs0
    slots:
      camera: cv_camera0
      fs: filesystem0
    processes:
      - type_name: capture_save
        name: capture_save0
