name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # README の手順で使う juiz_app と pyjuiz の版。Cargo.toml の juiz_sdk と合わせる
  JUIZ_VERSION: "0.1.0"
  # Transformations のサンプル (transformations.conf) は juiz の次の版で入る機能を使うので、公開までは
  # juiz の main のコミットから入れる。Cargo.toml の rev と合わせる。公開後は JUIZ_VERSION の版の指定に戻す
  JUIZ_GIT_REV: "b90770b1b6451a37bd712b22b33c78da882496d7"

jobs:
  examples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # juiz_app は Python を組み込むので、ビルドに Python の開発用ファイルが要る
      - name: Python の開発用ファイルを入れる (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-dev
      # juiz が組み込む Python と pyjuiz を入れる Python をそろえるため、macOS では setup-python の 3.14 を使う
      # (Homebrew の python3 のままだと、juiz から pyjuiz が見えない)
      - name: Python 3.14 を入れる (macOS)
        if: runner.os == 'macOS'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - name: juiz コマンドのキャッシュ
        id: juiz-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/juiz
          key: juiz-app-${{ env.JUIZ_GIT_REV }}-${{ runner.os }}-${{ runner.arch }}-py314
      - name: juiz コマンドをインストールする
        if: steps.juiz-cache.outputs.cache-hit != 'true'
        run: cargo install juiz_app --git https://github.com/OpenJUIZ/juiz --rev "$JUIZ_GIT_REV" --locked
      # データ型のサンプル (typed_pose.conf) の Python の Process が pyjuiz を使う
      - name: pyjuiz をインストールする
        run: python3 -m pip install --user --break-system-packages "pyjuiz @ git+https://github.com/OpenJUIZ/juiz@${JUIZ_GIT_REV}#subdirectory=bindings/pyjuiz"
      - uses: Swatinem/rust-cache@v2
      - name: サンプルをビルドする
        run: cargo build
      - name: サンプルを動かして結果を確かめる
        run: python3 tests/test_examples.py
      # テストで作った .juizapp (packages/) を、タグのときに Releases に載せるため残す
      - uses: actions/upload-artifact@v4
        with:
          name: juizapp-${{ matrix.os }}
          path: dist/*.juizapp
          if-no-files-found: error

  # stable と違う版の rustc でビルドした .juizapp が、pip で入れた juiz (juiz の CI がビルドしたもの) で動くこと。
  # Rust のプラグインはプラグインの C ABI で読み込まれるので、rustc がそろっていなくてよい (OpenJUIZ/juiz#291)
  cross-rustc:
    runs-on: ubuntu-latest
    env:
      OTHER_RUSTC: "1.88.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.OTHER_RUSTC }}
      - name: pip で juiz を入れる
        run: |
          python -m venv .venv
          .venv/bin/pip install "juiz-cli==${JUIZ_VERSION}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: rustc ${{ env.OTHER_RUSTC }} で talker と listener をビルドする
        run: |
          rustc -V
          cargo build -p talker -p listener
      - name: .juizapp を作って pip の juiz で動かす
        run: python3 tests/test_examples.py --package-only
      - name: マニフェストに rustc を書いていないこと (C ABI のプラグインだけ)
        run: |
          python3 - <<'PY'
          import glob, zipfile
          path, = glob.glob("dist/talker_listener-0.1.0-*.juizapp")
          manifest = zipfile.ZipFile(path).read("juizapp.yaml").decode()
          print(manifest)
          assert "abi: 1" in manifest and "rustc" not in manifest, "rust.abi が無いか、rust.rustc が書かれています"
          PY

  # v* のタグを付けたときは、各 OS で作った .juizapp を Releases に載せる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: juizapp-*
          path: dist
          merge-multiple: true
      - name: Releases に載せる
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "サンプルのアプリの .juizapp (juiz ${GITHUB_REF_NAME#v} 用)"
          gh release upload "$GITHUB_REF_NAME" dist/*.juizapp --clobber
