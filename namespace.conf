name: namespace_example
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    talker:
      path: "./target/debug"
    listener:
      path: "./target/debug"
# 同じ名前の talker0 / listener0 を robot1 と robot2 の 2 つのネームスペースに置く。
# Topic 名 chatter も各ネームスペースの中で解決される (robot1/chatter と robot2/chatter) ので、
# robot1 の listener0 には robot1 の talker0 の出力だけが届く。
processes:
  - type_name: talker
    name: talker0
    namespace: robot1
    publishes: [chatter]
    p_apply:
      message: "Hello from robot1"
  - type_name: listener
    name: listener0
    namespace: robot1
    subscribes:
      arg1: chatter
  - type_name: talker
    name: talker0
    namespace: robot2
    publishes: [chatter]
    p_apply:
      message: "Hello from robot2"
  - type_name: listener
    name: listener0
    namespace: robot2
    subscribes:
      arg1: chatter
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 1.0
    bind:
      - name: talker0
        namespace: robot1
        type_name: talker
      - name: talker0
        namespace: robot2
        type_name: talker
    auto_start: true
