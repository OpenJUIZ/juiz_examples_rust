# 制御ループの例: センサを読む → P 制御 → モータに出す、を 1 つの
# CompositeContainerProcess にまとめ、実行コンテキスト (EC) に bind する。
# 3 段が毎周期この順番で必ず 1 回ずつ実行される。
name: control_loop
option:
  http_broker:
    start: true
    port: 8000
plugins:
  components:
    example_control:
      language: rust
      path: "./target/debug"
composites:
  # follow_target(cc{sensor, motor}, target)
  #   = dummy_motor_drive(cc.motor,
  #         velocity = p_control(measured = dummy_sensor_read(cc.sensor), gain = 2.0))
  - type_name: follow_target
    description: "位置を読み、P 制御で速度を決めてモータに出す"
    containers:
      sensor: dummy_sensor
      motor: dummy_motor
    body:
      process: dummy_motor_drive
      container: motor
      args:
        velocity:
          process: p_control
          args:
            measured: { process: dummy_sensor_read, container: sensor }
            gain: { const: 2.0 }
            # target は書いていないので、元の名前と既定値 (1.0) のまま公開される
containers:
  - type_name: dummy_sensor
    name: sensor0
  - type_name: dummy_motor
    name: motor0
    dt: 0.05
composite_containers:
  # スロット名 → 既存の Container の名前
  - name: robot0
    slots:
      sensor: sensor0
      motor: motor0
    processes:
      - type_name: follow_target
        name: follow0
ecs:
  - name: ec0
    type_name: main_loop_ec
    rate: 20.0
    bind:
      # ContainerProcess は Container の名前 (container_name) も書く
      - { name: follow0, type_name: follow_target, container_name: robot0 }
    auto_start: true
