[workspace]
resolver = "2"
members = [
    "process/talker",
    "process/listener",
    "process/increment_process",
    "process/decrement_process",
    "process/pose_move",
    "container/example_container",
    "container/example_container_get",
    "container/example_container_increment",
    "component/example_component",
    "component/example_control",
    "component/juiz_opencv",
]
# juiz_opencv は OpenCV のインストールが必要なので、既定のビルド対象から外している。
# ビルドするときは `cargo build -p juiz_opencv` を使う。
default-members = [
    "process/talker",
    "process/listener",
    "process/increment_process",
    "process/decrement_process",
    "process/pose_move",
    "container/example_container",
    "container/example_container_get",
    "container/example_container_increment",
    "component/example_component",
    "component/example_control",
]

[workspace.dependencies]
# データ型 (types/geometry.jidl を使うサンプル) は juiz の次の版で入るので、公開までは juiz の main のコミットを使う。
# 公開後は juiz_sdk = "0.0.23" のような版の指定に戻す
juiz_sdk = { git = "https://github.com/OpenJUIZ/juiz", rev = "359438b023cd4ba982e7c1ef6a9ddaf3c15d76ab" }
juiz_core = { git = "https://github.com/OpenJUIZ/juiz", rev = "359438b023cd4ba982e7c1ef6a9ddaf3c15d76ab" }
juiz_idl = { git = "https://github.com/OpenJUIZ/juiz", rev = "359438b023cd4ba982e7c1ef6a9ddaf3c15d76ab" }
anyhow = "1"
