# Container を含まない Composite の例。
# 子の Process (increment_process / decrement_process) のインスタンスは作らず、
# 本体の関数を合成して 1 つの Process の型にする。
name: composite
option:
  http_broker:
    start: true
    port: 8000
plugins:
  process_factories:
    increment_process:
      path: "./target/debug"
    decrement_process:
      path: "./target/debug"
composites:
  # inc_twice(arg1) = increment_process(increment_process(arg1))
  # 書かなかった引数 (内側の arg1) は元の名前のまま公開される
  - type_name: inc_twice
    description: "1 を 2 回足す"
    body:
      process: increment_process
      args:
        arg1: { process: increment_process }
  # plus_one(x) = decrement_process(inc_twice(x))
  # 先に定義した Composite を子に使える。expose で引数の名前を付け替える
  - type_name: plus_one
    description: "2 足して 1 引く"
    body:
      process: decrement_process
      args:
        arg1:
          process: inc_twice
          args:
            arg1: { expose: x }
processes:
  # Composite のインスタンスは普通の Process と同じように作る。
  # trace: true にすると、式の木の各段の戻り値をログに出す
  - type_name: inc_twice
    name: inc_twice0
    trace: true
  - type_name: plus_one
    name: plus_one0
