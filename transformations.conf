# Transformations のサンプル: 部品の位置関係を木にして、位置姿勢を読み書きする (OpenJUIZ/juiz#374)
#
#   map (Periodic, 10 Hz) → odom (Static) → base0 (台車) → pantilt0 (雲台) → camera0 (カメラ)
#
# map と odom は juiz に組み込みの Anchor (基点) で、プラグインは要らない。
name: transformations
option:
  http_broker:
    start: true
    port: 8000
plugins:
  components:
    mobile_robot:
      language: rust
      path: "./target/debug"
processes:
  - type_name: pose_print
    name: print0
containers:
  - type_name: periodic_anchor
    name: map
    rate: 10.0
    # 床のモデル (.glb)。glTF は Y 上なので、juiz が x 軸まわりに +90° 回して Z 上にそろえる (OpenJUIZ/juiz#385)
    model:
      path: models/floor.glb
  - type_name: static_anchor
    name: odom
  - type_name: mobile_base
    name: base0
    processes:
      - type_name: mobile_base_move
        name: move0
    # 台車のモデル (.glb)。前 (+x) に黄色の三角の印
    model:
      path: models/mobile_base.glb
  - type_name: pantilt
    name: pantilt0
    processes:
      - type_name: pantilt_set_pan
        name: pan0
    # 雲台のモデル (手書きの SDF)。<material> の無い台座は color で塗る
    model:
      path: models/pantilt.sdf
      color: "#606060"
  - type_name: camera
    name: camera0
    processes:
      - type_name: camera_pose
        name: camera_pose0
    # カメラのモデル (.stl、mm で作ったもの)。原点が背面なので origin で 15 mm 後ろにずらし、カメラの中心を Container の原点に合わせる
    model:
      path: models/camera.stl
      scale: 0.001
      origin:
        translation: {x: -0.015, y: 0.0, z: 0.0}
      color: "#e0e0e0"
# 親 → 子 の Transform。translation / rotation を省くと 0 と回転なし
transforms:
  # 自己位置推定で直す map → odom のずれ
  - source: map
    destination: odom
    translation: {x: 1.0, y: 2.0, z: 0.0}
  # move0 が set_pose で書き換える
  - source: odom
    destination: base0
  # 雲台の取り付け位置。pan0 が set_pose で向きを書き換える
  - source: base0
    destination: pantilt0
    translation: {x: 0.1, y: 0.0, z: 0.3}
  # カメラは雲台に固定 (Transform だけ)
  - source: pantilt0
    destination: camera0
    translation: {x: 0.05, y: 0.0, z: 0.02}
# Pose 通知: base0 の位置姿勢が書かれたら、odom から見た値を print0 の引数 pose に渡して呼ぶ
pose_listeners:
  - container: base0
    process: print0
    arg: pose
    reference: odom
