# System をまたぐ Transform のサンプル: 地図の System (OpenJUIZ/juiz#417)
#
#   地図の System (このファイル、ポート 8000)       ロボットの System (transformations_robot.conf、ポート 8001)
#   map (Periodic, 10 Hz) ───────────────────────→ odom (Static) → base0 (台車) → pantilt0 (雲台) → camera0 (カメラ)
#
# map → odom の Transform はロボットの System が持ち、ロボットの System が map の位置を取りに来る
# (「写し」として取り込む)。こちらの System には Transform を書かなくてよい。先にこちらを起動する。
name: transformations_map
option:
  http_broker:
    start: true
    port: 8000
containers:
  - type_name: periodic_anchor
    name: map
    rate: 10.0
